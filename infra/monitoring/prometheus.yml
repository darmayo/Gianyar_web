global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gianyar-web'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'nextjs'
    static_configs:
      - targets: ['nextjs:3000']
    metrics_path: /api/metrics

  - job_name: 'nestjs'
    static_configs:
      - targets: ['nestjs:4000']
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
