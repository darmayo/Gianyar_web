services:
  postgres-test:
    image: postgres:16-alpine
    container_name: gianyar-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: gianyar_test
      POSTGRES_USER: gianyar_test
      POSTGRES_PASSWORD: change-test-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gianyar_test -d gianyar_test"]
      interval: 5s
      timeout: 5s
      retries: 10
