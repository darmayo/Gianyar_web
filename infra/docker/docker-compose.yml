version: '3.9'

# ============================================================
# Docker Compose — Layanan Lokal Gianyar Web
# Jalankan: npm run docker:up
# ============================================================

services:
  # === PostgreSQL Primary ===
  postgres:
    image: postgres:16-alpine
    container_name: gianyar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gianyar_db
      POSTGRES_USER: gianyar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gianyar_user -d gianyar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gianyar_net

  # === Redis (Cache + Rate Limiting + Session) ===
  redis:
    image: redis:7-alpine
    container_name: gianyar_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-dev_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gianyar_net

  # === MinIO (File Storage — S3 Compatible) ===
  minio:
    image: minio/minio:latest
    container_name: gianyar_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - gianyar_net

  # === Mailhog (Email Testing Lokal) ===
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gianyar_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - gianyar_net

  # === Adminer (Database GUI — Development) ===
  adminer:
    image: adminer:4
    container_name: gianyar_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gianyar_net

volumes:
  postgres_data:
    name: gianyar_postgres_data
  redis_data:
    name: gianyar_redis_data
  minio_data:
    name: gianyar_minio_data

networks:
  gianyar_net:
    name: gianyar_network
    driver: bridge
