# ============================================================
# Nginx Config — Portal Kabupaten Gianyar
# Security: HTTPS only, anti-fingerprinting, rate limiting
# Performance: gzip, caching, HTTP/2
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time rid=$request_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 12m;

    # ── Anti-fingerprinting (1): Sembunyikan versi Nginx ─────
    server_tokens off;

    # ── Anti-fingerprinting (2): Hapus header yang bocorkan stack
    # Header ini dikirim Next.js dan mengungkap teknologi yang dipakai
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-NextJS-Cache;
    proxy_hide_header x-nextjs-cache;
    proxy_hide_header x-nextjs-matched-path;
    proxy_hide_header x-nextjs-page;
    proxy_hide_header x-nextjs-stale-time;

    # ── Anti-fingerprinting (3): Custom Server header ────────
    # Ganti "nginx/1.x.x" atau "Next.js" dengan nama generik
    # Server header asli hanya bisa diubah total dengan module ngx_headers_more
    # atau build Nginx kustom. Hindari directive non-portable agar config valid.

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/h;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ============================================================
    # REDIRECT HTTP → HTTPS
    # ============================================================
    server {
        listen 80;
        server_name gianyarkab.go.id www.gianyarkab.go.id;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # MAIN HTTPS SERVER
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name gianyarkab.go.id www.gianyarkab.go.id;

        # Sembunyikan versi server di level server block
        add_header Server "GianyarWebServer" always;

        # === SSL / TLS ===
        ssl_certificate /etc/nginx/ssl/gianyar.crt;
        ssl_certificate_key /etc/nginx/ssl/gianyar.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # === SECURITY HEADERS ===
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self'; font-src 'self' fonts.gstatic.com; object-src 'none'; frame-src 'self' https://maps.google.com https://www.youtube.com;"
            always;
        add_header X-Request-ID $request_id always;

        # Rate limiting
        limit_req zone=global burst=20 nodelay;
        limit_conn conn_limit 20;

        # ── Anti-fingerprinting (4): Rewrite /_next/ → /_s/ ──
        # Ini menyembunyikan path signature Next.js dari scanner
        # Browser tetap bisa akses karena Nginx merewrite secara transparan
        location /_s/ {
            rewrite ^/_s/(.*)$ /_next/$1 break;
            proxy_pass http://nextjs:3000;
            proxy_hide_header X-Powered-By;
            proxy_hide_header x-nextjs-cache;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Server "GianyarWebServer" always;
        }

        # Internal /_next/ — hanya diakses Nginx sendiri (saat rewrite)
        # Block akses langsung dari luar ke /_next/ agar scanner tidak bisa fingerprint
        location /_next/ {
            # Izinkan akses internal dari rewrite, blokir akses langsung luar
            # Uncomment baris berikut setelah mengupdate semua asset URL ke /_s/
            # internal;
            proxy_pass http://nextjs:3000;
            proxy_hide_header X-Powered-By;
            proxy_hide_header x-nextjs-cache;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Server "GianyarWebServer" always;
        }

        # === FRONTEND (Next.js) ===
        location / {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 30s;

            # Strip fingerprint headers dari response Next.js
            proxy_hide_header X-Powered-By;
            proxy_hide_header x-nextjs-cache;
            proxy_hide_header x-nextjs-matched-path;
            proxy_hide_header x-nextjs-page;
            proxy_hide_header x-nextjs-stale-time;
        }

        # === API (Next.js route handlers) ===
        location /api/ {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
            proxy_hide_header X-Powered-By;
        }

        # Auth endpoints — rate limit ketat
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://nextjs:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Upload endpoints
        location /api/upload {
            limit_req zone=upload burst=2 nodelay;
            client_max_body_size 12m;
            proxy_pass http://nextjs:3000;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /favicon.ico {
            proxy_pass http://nextjs:3000;
            add_header Cache-Control "public, max-age=86400";
        }

        # Blokir akses ke file tersembunyi (.env, .git, dll)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Blokir scanner umum (robots)
        location = /wp-admin { return 404; }
        location = /wp-login.php { return 404; }
        location = /phpinfo.php { return 404; }
        location = /.env { deny all; return 404; }
    }
}
